const CARDS_PER_DAY = 6;
const TAGS = ['卷王','老好人','发疯文学','躺平大师','随叫随到'];

  peer0:   {k:'结局 02 · 孤立',t:'全公司最后一个知道你被孤立的人，是你自己',x:'群还在，你发的消息下面只有空气。中午没人喊你吃饭，你一个人点了外卖，还点了两瓶饮料假装有人陪。'},

  win:     {k:'结局 04 · 通关',t:'你活着走到了周五 18:00',x:'周报写了，饼吃了，锅推了，会开了，人还在。周末两天，你属于你自己。\n这就是打工人最伟大的胜利：什么都没赢，但什么都没输光。'}

const TAGBONUS = {
  '卷王':{t:'卷王结局 · 潜力和活儿',x:'你的工牌在发光，你的眼睛也是。领导说你很有潜力——潜台词是还有更多活。'},

const $ = id => document.getElementById(id);
const store = {
  get seen(){ try{ return JSON.parse(localStorage.getItem('ydbh_seen')||'[]') }catch(e){ return [] } },
  set seen(v){ localStorage.setItem('ydbh_seen', JSON.stringify(v)) },
  get endings(){ try{ return JSON.parse(localStorage.getItem('ydbh_endings')||'[]') }catch(e){ return [] } },
  set endings(v){ localStorage.setItem('ydbh_endings', JSON.stringify(v)) }
};

let S = null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

function buildDeck(){
  const seen = store.seen;
  const unseen = CARDS.filter(c=>!seen.includes(c.id));
  const seenCards = CARDS.filter(c=>seen.includes(c.id));
  const ordered = shuffle(unseen.slice()).concat(shuffle(seenCards.slice()));
  const need = DAYS.length * CARDS_PER_DAY;
  let deck = ordered.slice(0, need);
  // 时效池卡保证至少出现 1 张
  if(!deck.some(c=>c.pool==='时效')){
    const hot = CARDS.find(c=>c.pool==='时效');
    if(hot){ deck[need-1] = hot }
  }
  // 门面卡 W1 或 L10 保证在第一周目出现
  if(!deck.some(c=>c.id==='W1'||c.id==='L10')){
    const gate = CARDS.find(c=>c.id==='W1');
    if(gate){ deck[2] = gate }
  }
  return deck;
}

function startRun(){
  S = {boss:50,peer:50,spirit:50,tags:{},deck:buildDeck(),i:0,tagStreak:{last:null,count:0},over:false,played:[]};
  $('scrStart').classList.add('hide');
  $('scrEnd').classList.add('hide');
  renderProgress();
  renderCard();
}

function renderProgress(){
  const el = $('progress'); el.innerHTML='';
  for(let d=0;d<DAYS.length;d++){
    const div = document.createElement('div');
    div.className = 'pd' + (S.i >= (d+1)*CARDS_PER_DAY ? ' done' : '');
    el.appendChild(div);
  }
  const dIdx = Math.min(DAYS.length-1, Math.floor(S.i / CARDS_PER_DAY));
  const hh = [9,10,14,16,17][dIdx];
  const sum = CARDS_PER_DAY*DAYS.length;
  $('dayLabel').textContent = `${DAYS[dIdx]} · ${String(hh).padStart(2,'0')}:00 · ${Math.min(S.i+1,sum)}/${sum}`;
}

function bars(){
  const v = S || {boss:50,peer:50,spirit:50};
  $('vBoss').textContent = v.boss; $('fBoss').style.width = v.boss+'%';
  $('vPeer').textContent = v.peer; $('fPeer').style.width = v.peer+'%';
  $('vSpirit').textContent = v.spirit; $('fSpirit').style.width = v.spirit+'%';
}

function renderCard(){
  const c = S.deck[S.i];
  if(!c){ return endRun('win') }
  const art = $('art');
  art.innerHTML = '';
  if(c.art){
    const img = document.createElement('img');
    img.src = c.art; img.alt = c.sc;
    img.onerror = () => { art.innerHTML = ph(c) };
    art.appendChild(img);
  } else {
    art.innerHTML = ph(c);
  }
  const label = document.createElement('div');
  label.className = 'tagline';
  label.textContent = `${c.pool==='时效'?'限时 · ':''}${c.sc}`;
  art.appendChild(label);
  $('face').textContent = c.face;
  $('txtL').textContent = c.L.t;
  $('txtR').textContent = c.R.t;
  const card = $('card');
  card.classList.remove('fly-left','fly-right','in');
  void card.offsetWidth;
  card.classList.add('in');
  bars(); renderProgress();
}

function ph(c){
  const idx = S.i+1;
  return `<div class="ph"><div class="big">${String(idx).padStart(2,'0')}</div><div class="sm">${c.sc}</div></div>`;
}

function choose(side){
  if(!S || S.over || S.lock) return;
  S.lock = true;
  const c = S.deck[S.i];
  const opt = side==='L' ? c.L : c.R;
  const db = opt.b||0, dp = opt.p||0, ds = opt.s||0;
  S.boss = Math.max(0,Math.min(100,S.boss+db));
  S.peer = Math.max(0,Math.min(100,S.peer+dp));
  S.spirit = Math.max(0,Math.min(100,S.spirit+ds));
  if(!S.played.includes(c.id)) S.played.push(c.id);

  // tag streak
  if(S.tagStreak.last===side){ S.tagStreak.count++ } else { S.tagStreak.last=side; S.tagStreak.count=1 }
  if(opt.tag){
    S.tags[opt.tag] = (S.tags[opt.tag]||0)+1;
    if(S.tags[opt.tag]===3) showTag(`人设成型：${opt.tag}`);
  }

  showToast(opt.fb, db, dp, ds);
  const card = $('card');
  card.classList.add(side==='L' ? 'fly-left' : 'fly-right');
  bars();

  setTimeout(()=>{
    S.i++;
    S.lock = false;
    if(S.boss<=0) return endRun('boss0');
    if(S.peer<=0) return endRun('peer0');
    if(S.spirit<=0) return endRun('spirit0');
    if(S.i>=S.deck.length) return endRun('win');
    renderCard();
  }, 330);
}

let toastTimer=null;
function showToast(text,db,dp,ds){
  const el = $('toast');
  const parts = [];
  if(db) parts.push(`老板信任 ${db>0?'+':''}${db}`);
  if(dp) parts.push(`同事关系 ${dp>0?'+':''}${dp}`);
  if(ds) parts.push(`精神值 ${ds>0?'+':''}${ds}`);
  if(!parts.length) parts.push('状态无变化');
  el.innerHTML = `${text}<div class="d">${parts.map(p=>`<span>${p}</span>`).join('')}</div>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1500);
}

let tagTimer=null;
function showTag(text){
  const el = $('tagToast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(tagTimer);
  tagTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}

function endRun(kind){
  S.over = true;
  const base = RULES[kind];
  let title = base.t, text = base.x, kicker = base.k;
  if(kind==='win'){
    const top = Object.entries(S.tags).sort((a,b)=>b[1]-a[1])[0];
    if(top && top[1]>=3 && TAGBONUS[top[0]]){
      kicker = '结局 04 · 通关 · ' + top[0];
      text = base.x + '\n\n' + TAGBONUS[top[0]].x;
    }
  }
  $('endKicker').textContent = kicker;
  $('endTitle').textContent = title;
  $('endText').textContent = text;
  $('eBoss').textContent = S.boss; $('ePeer').textContent = S.peer; $('eSpirit').textContent = S.spirit;
  const bd = $('endBadges'); bd.innerHTML='';
  Object.entries(S.tags).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    const d = document.createElement('div'); d.className='badge'; d.textContent = `${k} ×${v}`; bd.appendChild(d);
  });
  if(!Object.keys(S.tags).length){
    const d = document.createElement('div'); d.className='badge'; d.textContent='没有形成任何人设'; bd.appendChild(d);
  }
  const seen = store.seen.slice();
  S.played.forEach(id=>{ if(!seen.includes(id)) seen.push(id) });
  store.seen = seen;
  const endings = store.endings.slice();
  const ekey = kind==='win' ? 'win' : kind;
  if(!endings.includes(ekey)) endings.push(ekey);
  store.endings = endings;
  $('endMeta').textContent = `本周走过 ${S.played.length} 个瞬间 · 累计解锁 ${store.seen.length}/${CARDS.length} 张卡 · 结局 ${store.endings.length}/4`;
  $('scrEnd').classList.remove('hide');
}

// 交互：按钮 + 键盘 + 滑动
$('btnL').addEventListener('click',()=>choose('L'));
$('btnR').addEventListener('click',()=>choose('R'));
$('btnStart').addEventListener('click',startRun);
$('btnAgain').addEventListener('click',startRun);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') choose('L');
  if(e.key==='ArrowRight') choose('R');
});

let dragging=false, sx=0, sy=0, dx=0;
const card = $('card');
card.addEventListener('pointerdown',e=>{
  if(S && S.over) return;
  dragging=true; sx=e.clientX; sy=e.clientY; dx=0;
  card.style.transition='none';
});
card.addEventListener('pointermove',e=>{
  if(!dragging) return;
  dx = e.clientX - sx;
  const dy = e.clientY - sy;
  if(Math.abs(dx)>Math.abs(dy)){
    card.style.transform = `translateX(${dx}px) rotate(${dx/40}deg)`;
  }
});
function release(){
  if(!dragging) return;
  dragging=false;
  card.style.transition='transform .18s ease-out';
  if(dx < -60){ card.style.transform=''; choose('L'); }
  else if(dx > 60){ card.style.transform=''; choose('R'); }
  else { card.style.transform=''; }
}
card.addEventListener('pointerup',release);
card.addEventListener('pointercancel',release);
card.addEventListener('pointerleave',release);

(function(){
  $('startMeta').textContent = `已解锁 ${store.seen.length}/${CARDS.length} 张卡 · 已收集结局 ${store.endings.length}/4`;
  bars();
})();

(function(){
  const q = location.search + location.hash;
  if(!/auto/.test(q)) return;
  window.__autoLog = {errors:[], steps:0, ended:false};
  window.addEventListener('error', e => window.__autoLog.errors.push(String(e.message)));
  document.documentElement.setAttribute('data-auto','starting');
  try { startRun(); } catch(err){ document.documentElement.setAttribute('data-auto','startfail:'+err.message); return; }
  if(/w1/.test(location.hash)){
    const k = S.deck.findIndex(c=>c.id==='W1');
    if(k>0){ [S.deck[0],S.deck[k]] = [S.deck[k],S.deck[0]]; renderCard(); }
  }
  document.documentElement.setAttribute('data-auto','running');
  if(/pause/.test(location.hash)) return;
  const timer = setInterval(()=>{
    if(!S || S.over){
      clearInterval(timer);
      window.__autoLog.ended = true;
      document.documentElement.setAttribute('data-auto','done');
      document.documentElement.setAttribute('data-auto-info','steps=' + window.__autoLog.steps + ' i=' + (S?S.i:'-') + ' boss=' + (S?S.boss:'-'));
      document.title = 'AUTOTEST_DONE';
      return;
    }
    window.__autoLog.steps++;
    choose(Math.random()<0.5 ? 'L' : 'R');
  }, 60);
})();

</script>
